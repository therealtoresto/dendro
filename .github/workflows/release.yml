# A tag like v0.12.1 publishes that version: the tests and the typecheck run first, then the package goes to the
# VS Code Marketplace (trusted publishing: the Marketplace trusts this workflow, so no token is kept), to Open VSX
# when its token is set, and to a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # The OIDC token the Marketplace exchanges for a publish credential.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run package

      # vsce 4 brings --oidc; the project keeps vsce 3 for packaging on older Node.
      - name: VS Code Marketplace
        run: npx -y @vscode/vsce@4.1.1 publish --oidc --no-dependencies --packagePath dendro.vsix

      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish dendro.vsix

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dendro.vsix --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
